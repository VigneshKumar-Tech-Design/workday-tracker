<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workday Tracker</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --line:rgba(255,255,255,.72);
      --line-soft:rgba(255,255,255,.28);
      --dim:rgba(255,255,255,.58);
      --radius:6px;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
      margin:0;
    }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      letter-spacing:.2px;
    }

    /* Subtle monochrome CRT effect */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity:.55;
    }

    .wrap{
      width:min(1000px,100%);
      aspect-ratio:2 / 1;
      min-height:0;
    }

    .terminal{
      width:100%;
      height:100%;
      min-height:0;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#000;
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr auto;
      box-shadow:0 0 0 1px rgba(255,255,255,.05) inset;
    }

    /* HEADER */
    .hdr{
      min-width:0;
      height:42px;
      padding:0 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      font-size:13px;
      text-transform:uppercase;
    }

    .hdr .right{
      color:var(--dim);
      white-space:nowrap;
    }

    /* MAIN CONTENT */
    .body{
      min-height:0;
      padding:14px 18px;
      display:grid;
      grid-template-rows:auto auto auto auto;
      align-content:center;
      gap:12px;
    }

    /* TIMER */
    .timer{
      text-align:center;
      min-height:0;
    }

    .clock{
      font-size:clamp(32px,5vw,54px);
      line-height:1;
      letter-spacing:2px;
      font-weight:700;
    }

    .label{
      margin-top:6px;
      color:var(--dim);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1.5px;
    }

    /* PROGRESS */
    .progress-row{
      display:grid;
      grid-template-columns:1fr 48px;
      align-items:center;
      gap:10px;
    }

    .bar{
      height:30px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:5px;
    }

    .bar-inner{
      height:100%;
      border:1px solid var(--line-soft);
      border-radius:3px;
      overflow:hidden;
      background:rgba(255,255,255,.04);
    }

    .fill{
      width:0%;
      height:100%;
      background:#fff;
      transition:width .4s linear;
    }

    .pct{
      text-align:right;
      color:var(--dim);
      font-size:12px;
    }

    /* WORKDAY DETAILS */
    .details{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .box{
      min-width:0;
      border:1px solid var(--line-soft);
      border-radius:var(--radius);
      padding:9px 11px;
    }

    .box .k{
      color:var(--dim);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1.1px;
    }

    .box .v{
      margin-top:5px;
      font-size:15px;
      white-space:nowrap;
    }

    /* CONTROLS */
    .controls{
      min-width:0;
      border:1px solid var(--line-soft);
      border-radius:var(--radius);
      padding:8px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .control-left{
      min-width:0;
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
    }

    .control-label{
      color:var(--dim);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    input[type="time"]{
      width:130px;
      height:36px;
      padding:6px 9px;
      background:#000;
      color:#fff;
      border:1px solid var(--line);
      border-radius:6px;
      font-family:inherit;
      font-size:13px;
      outline:none;
    }

    input[type="time"]::-webkit-calendar-picker-indicator{
      filter:invert(1);
    }

    button{
      height:36px;
      padding:0 13px;
      background:#000;
      color:#fff;
      border:1px solid var(--line);
      border-radius:6px;
      font-family:inherit;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
    }

    button:hover{
      background:#fff;
      color:#000;
    }

    button:active{
      transform:translateY(1px);
    }

    button.small{
      color:var(--dim);
      border-color:var(--line-soft);
    }

    /* COMPLETE MESSAGE */
    .complete{
      display:none;
      text-align:center;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:7px;
      font-size:10px;
      letter-spacing:1.8px;
      text-transform:uppercase;
    }

    .complete.show{
      display:block;
    }

    /* FOOTER */
    .foot{
      min-width:0;
      height:34px;
      padding:0 14px;
      border-top:1px solid var(--line-soft);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      color:rgba(255,255,255,.38);
      font-size:9px;
      text-transform:uppercase;
    }

    .kbd{
      border:1px solid var(--line-soft);
      border-radius:4px;
      padding:2px 5px;
      color:var(--dim);
    }

    .status{
      text-align:center;
      color:var(--dim);
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:1.2px;
    }

    /* MOBILE */
    @media(max-width:650px){
      body{
        padding:8px;
      }

      .wrap{
        aspect-ratio:auto;
      }

      .terminal{
        height:auto;
      }

      .details{
        grid-template-columns:1fr;
      }

      .foot{
        height:auto;
        min-height:34px;
        padding:8px 10px;
        flex-wrap:wrap;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .fill{transition:none}
      button:active{transform:none}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="terminal" aria-label="Workday Tracker">

      <header class="hdr">
        <div>WORKDAY TRACKER</div>
        <div class="right" id="today">---</div>
      </header>

      <section class="body">

        <div class="timer">
          <div class="clock" id="worked">00:00:00</div>
          <div class="label">WORKED</div>
        </div>

        <div class="progress-row" aria-label="Workday progress">
          <div class="bar">
            <div class="bar-inner">
              <div class="fill" id="fill"></div>
            </div>
          </div>
          <div class="pct" id="pct">0%</div>
        </div>

        <div class="complete" id="complete">
          WORKDAY COMPLETE
        </div>

        <div class="details">
          <div class="box">
            <div class="k">ENTRY TIME</div>
            <div class="v" id="entryDisp">--:--</div>
          </div>

          <div class="box">
            <div class="k">EXIT TIME</div>
            <div class="v" id="exitDisp">--:--</div>
          </div>

          <div class="box">
            <div class="k">TIME REMAINING</div>
            <div class="v" id="remaining">08:00:00</div>
          </div>
        </div>

        <div class="controls">
          <div class="control-left">
            <span class="control-label">ENTRY:</span>
            <input id="entryInput" type="time" step="60" aria-label="Entry time">
            <button id="startBtn" type="button">START</button>
          </div>

          <button id="resetBtn" type="button" class="small">RESET</button>
        </div>

        <div class="status" id="status">
          ENTER TIME AND PRESS START
        </div>

      </section>

      <footer class="foot">
        <div>MONO/CRT MODE</div>
        <div>
          KEYS:
          <span class="kbd">ENTER</span> START
          &nbsp;•
          <span class="kbd">ESC</span> RESET
        </div>
      </footer>

    </main>
  </div>

  <script>
    const WORKDAY_HOURS = 8;
    const WORKDAY_MS = WORKDAY_HOURS * 60 * 60 * 1000;

    const $ = id => document.getElementById(id);

    const todayEl = $("today");
    const entryInput = $("entryInput");
    const startBtn = $("startBtn");
    const resetBtn = $("resetBtn");
    const entryDisp = $("entryDisp");
    const exitDisp = $("exitDisp");
    const workedEl = $("worked");
    const remainingEl = $("remaining");
    const pctEl = $("pct");
    const fillEl = $("fill");
    const completeEl = $("complete");
    const statusEl = $("status");

    let entryDate = null;
    let tickTimer = null;

    function pad2(n){
      return String(n).padStart(2,"0");
    }

    function fmtHMS(ms){
      ms = Math.max(0, ms);

      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return `${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`;
    }

    function fmtTime(date){
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const ap = hours >= 12 ? "PM" : "AM";
      const hh = hours % 12 || 12;

      return `${pad2(hh)}:${pad2(minutes)} ${ap}`;
    }

    function todayKey(){
      const d = new Date();

      return `workdayTracker.entry.${
        d.getFullYear()
      }-${
        pad2(d.getMonth() + 1)
      }-${
        pad2(d.getDate())
      }`;
    }

    function setHeaderDate(){
      const d = new Date();

      const dow = d.toLocaleDateString(undefined,{
        weekday:"short"
      }).toUpperCase();

      const day = pad2(d.getDate());

      const mon = d.toLocaleDateString(undefined,{
        month:"short"
      }).toUpperCase();

      todayEl.textContent = `${dow} ${day} ${mon}`;
    }

    function parseTime(hhmm){
      const [hh,mm] = hhmm.split(":").map(Number);

      const d = new Date();
      d.setHours(hh,mm,0,0);

      return d;
    }

    function stopTick(){
      if(tickTimer){
        clearInterval(tickTimer);
        tickTimer = null;
      }
    }

    function updateUI(){
      if(!entryDate){
        workedEl.textContent = "00:00:00";
        remainingEl.textContent = "08:00:00";
        pctEl.textContent = "0%";
        fillEl.style.width = "0%";
        entryDisp.textContent = "--:--";
        exitDisp.textContent = "--:--";
        completeEl.classList.remove("show");
        statusEl.textContent = "ENTER TIME AND PRESS START";
        return;
      }

      const now = new Date();
      const exitDate = new Date(entryDate.getTime() + WORKDAY_MS);

      const worked = Math.min(
        WORKDAY_MS,
        Math.max(0, now.getTime() - entryDate.getTime())
      );

      const remaining = Math.max(
        0,
        exitDate.getTime() - now.getTime()
      );

      const pct = Math.min(
        100,
        Math.round((worked / WORKDAY_MS) * 100)
      );

      entryDisp.textContent = fmtTime(entryDate);
      exitDisp.textContent = fmtTime(exitDate);
      workedEl.textContent = fmtHMS(worked);
      remainingEl.textContent = fmtHMS(remaining);
      pctEl.textContent = `${pct}%`;
      fillEl.style.width = `${pct}%`;

      const done = worked >= WORKDAY_MS;

      completeEl.classList.toggle("show",done);
      statusEl.textContent = done
        ? "SHIFT COMPLETE (SAVED)"
        : "RUNNING (SAVED)";
    }

    function startWith(hhmm){
      if(!hhmm) return;

      entryDate = parseTime(hhmm);

      localStorage.setItem(todayKey(),hhmm);

      stopTick();
      updateUI();

      tickTimer = setInterval(updateUI,1000);
    }

    function resetAll(){
      stopTick();

      localStorage.removeItem(todayKey());

      entryDate = null;
      entryInput.value = "";

      updateUI();
    }

    startBtn.addEventListener("click",()=>{
      startWith(entryInput.value);
    });

    resetBtn.addEventListener("click",resetAll);

    entryInput.addEventListener("keydown",(e)=>{
      if(e.key === "Enter"){
        startBtn.click();
      }
    });

    document.addEventListener("keydown",(e)=>{
      if(e.key === "Escape"){
        resetAll();
      }
    });

    // Initialize
    setHeaderDate();

    const saved = localStorage.getItem(todayKey());

    if(saved){
      entryInput.value = saved;
      startWith(saved);
    }else{
      const now = new Date();

      entryInput.value =
        `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

      updateUI();
    }
  </script>
</body>
</html>
