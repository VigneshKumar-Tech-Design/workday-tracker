<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workday Tracker</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --border:rgba(255,255,255,.75);
      --border2:rgba(255,255,255,.25);
      --dim:rgba(255,255,255,.65);
      --dim2:rgba(255,255,255,.35);
      --radius:6px;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      letter-spacing:.2px;
    }

    /* Subtle CRT/scanline + glow (strictly monochrome) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.06) 0px,
          rgba(255,255,255,.06) 1px,
          rgba(0,0,0,0) 2px,
          rgba(0,0,0,0) 4px
        );
      mix-blend-mode:overlay;
      opacity:.35;
    }
    body::after{
      content:"";
      position:fixed;
      inset:-20px;
      pointer-events:none;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.18), rgba(0,0,0,0) 55%);
      opacity:.25;
      filter: blur(10px);
    }

    .wrap{
      width:min(560px, calc(100vw - 28px));
    }

    .terminal{
      position:relative;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:rgba(0,0,0,.92);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
      overflow:hidden;
    }

    .hdr{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      font-size:14px;
      text-transform:uppercase;
    }
    .hdr .right{ color:var(--dim); }

    .body{
      padding:14px;
      display:grid;
      gap:12px;
    }

    .big{
      border:1px solid var(--border2);
      border-radius:var(--radius);
      padding:14px;
      text-align:center;
    }
    .clock{
      font-size:34px;
      line-height:1;
      letter-spacing:1px;
      text-shadow: 0 0 10px rgba(255,255,255,.20);
    }
    .label{
      margin-top:8px;
      font-size:12px;
      color:var(--dim);
      text-transform:uppercase;
      letter-spacing:1.4px;
    }

    .barRow{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .bar{
      flex:1;
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:6px;
    }
    .barInner{
      height:14px;
      border:1px solid var(--border2);
      border-radius:4px;
      overflow:hidden;
      background: rgba(255,255,255,.06);
    }
    .fill{
      height:100%;
      width:0%;
      background: var(--fg);
      transition: width .4s linear;
    }
    .pct{
      width:52px;
      text-align:right;
      color:var(--dim);
      font-size:13px;
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .box{
      border:1px solid var(--border2);
      border-radius:var(--radius);
      padding:10px;
      min-height:52px;
    }
    .box .k{
      font-size:11px;
      color:var(--dim);
      text-transform:uppercase;
      letter-spacing:1.2px;
    }
    .box .v{
      margin-top:6px;
      font-size:16px;
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--border2);
      border-radius:var(--radius);
      padding:10px;
    }
    .row .left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    input[type="time"]{
      background:transparent;
      color:var(--fg);
      border:1px solid var(--border);
      border-radius:6px;
      padding:8px 10px;
      font-family:inherit;
      font-size:14px;
      outline:none;
      min-width:140px;
    }
    input[type="time"]::-webkit-calendar-picker-indicator{
      filter: invert(1);
      opacity:.9;
    }

    button{
      background:transparent;
      color:var(--fg);
      border:1px solid var(--border);
      border-radius:6px;
      padding:8px 12px;
      font-family:inherit;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
    }
    button:hover{ background: rgba(255,255,255,.08); }
    button:active{ transform: translateY(1px); }
    button.small{
      padding:6px 10px;
      font-size:12px;
      border-color: var(--border2);
      color: var(--dim);
    }

    .status{
      text-align:center;
      font-size:12px;
      color:var(--dim);
      text-transform:uppercase;
      letter-spacing:1.4px;
      padding:6px 0 2px;
    }
    .complete{
      display:none;
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:10px;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:2px;
      font-size:12px;
    }
    .complete.show{ display:block; }

    .foot{
      padding:10px 14px 12px;
      border-top:1px solid var(--border2);
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:var(--dim2);
      font-size:11px;
    }

    .kbd{
      border:1px solid var(--border2);
      padding:1px 6px;
      border-radius:5px;
      color:var(--dim);
    }

    @media (max-width: 440px){
      .clock{ font-size:30px; }
      .grid2{ grid-template-columns: 1fr; }
      .pct{ width:46px; }
    }

    @media (prefers-reduced-motion: reduce){
      .fill{ transition:none; }
      button:active{ transform:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="terminal" role="application" aria-label="Workday Tracker">
      <div class="hdr">
        <div>WORKDAY TRACKER</div>
        <div class="right" id="today">---</div>
      </div>

      <div class="body">
        <div class="big">
          <div class="clock" id="worked">00:00:00</div>
          <div class="label" id="workedLabel">WORKED</div>
        </div>

        <div class="barRow" aria-label="Progress">
          <div class="bar">
            <div class="barInner" aria-hidden="true">
              <div class="fill" id="fill"></div>
            </div>
          </div>
          <div class="pct" id="pct">0%</div>
        </div>

        <div class="complete" id="complete">WORKDAY COMPLETE</div>

        <div class="grid2">
          <div class="box">
            <div class="k">ENTRY TIME</div>
            <div class="v" id="entryDisp">--:--</div>
          </div>
          <div class="box">
            <div class="k">EXIT TIME</div>
            <div class="v" id="exitDisp">--:--</div>
          </div>
        </div>

        <div class="box">
          <div class="k">TIME REMAINING</div>
          <div class="v" id="remaining">08:00:00</div>
        </div>

        <div class="row">
          <div class="left">
            <div style="color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1.2px;">ENTRY:</div>
            <input id="entryInput" type="time" step="60" aria-label="Entry time" />
            <button id="startBtn" type="button">START</button>
          </div>
          <button id="resetBtn" type="button" class="small" title="Clear saved entry time">RESET</button>
        </div>

        <div class="status" id="status">SAVED LOCALLY FOR TODAY</div>
      </div>

      <div class="foot">
        <div>MONO/CRT MODE</div>
        <div>Keys: <span class="kbd">Enter</span> start • <span class="kbd">Esc</span> reset</div>
      </div>
    </div>
  </div>

  <script>
    // --- Minimal workday tracker ---
    const WORKDAY_HOURS = 8;
    const WORKDAY_MS = WORKDAY_HOURS * 60 * 60 * 1000;

    const el = (id) => document.getElementById(id);
    const todayEl = el('today');
    const entryInput = el('entryInput');
    const startBtn = el('startBtn');
    const resetBtn = el('resetBtn');
    const entryDisp = el('entryDisp');
    const exitDisp = el('exitDisp');
    const workedEl = el('worked');
    const remainingEl = el('remaining');
    const pctEl = el('pct');
    const fillEl = el('fill');
    const completeEl = el('complete');
    const statusEl = el('status');

    function pad2(n){ return String(n).padStart(2,'0'); }

    function fmtHMS(ms){
      ms = Math.max(0, ms);
      const s = Math.floor(ms/1000);
      const hh = Math.floor(s/3600);
      const mm = Math.floor((s%3600)/60);
      const ss = s%60;
      return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
    }

    function fmtTime(date){
      // 12-hour with minutes
      const h = date.getHours();
      const m = date.getMinutes();
      const ap = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      return `${pad2(hh)}:${pad2(m)} ${ap}`;
    }

    function keyForToday(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = pad2(d.getMonth()+1);
      const dd = pad2(d.getDate());
      return `workdayTracker.entry.${yyyy}-${mm}-${dd}`;
    }

    function setHeaderDate(){
      const d = new Date();
      const dow = d.toLocaleDateString(undefined, { weekday:'short' }).toUpperCase();
      const day = pad2(d.getDate());
      const mon = d.toLocaleDateString(undefined, { month:'short' }).toUpperCase();
      todayEl.textContent = `${dow} ${day} ${mon}`;
    }

    function parseTimeToDate(hhmm){
      // hhmm is "HH:MM" in local time
      const [hh, mm] = hhmm.split(':').map(Number);
      const d = new Date();
      d.setHours(hh, mm, 0, 0);
      return d;
    }

    let entryDate = null;
    let tickTimer = null;

    function stopTick(){
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    }

    function updateUI(){
      if (!entryDate){
        workedEl.textContent = '00:00:00';
        remainingEl.textContent = fmtHMS(WORKDAY_MS);
        pctEl.textContent = '0%';
        fillEl.style.width = '0%';
        entryDisp.textContent = '--:--';
        exitDisp.textContent = '--:--';
        completeEl.classList.remove('show');
        statusEl.textContent = 'ENTER TIME AND PRESS START';
        return;
      }

      const now = new Date();
      const exitDate = new Date(entryDate.getTime() + WORKDAY_MS);
      const worked = Math.min(WORKDAY_MS, Math.max(0, now - entryDate));
      const remaining = Math.max(0, exitDate - now);
      const pct = Math.round((worked / WORKDAY_MS) * 100);

      entryDisp.textContent = fmtTime(entryDate);
      exitDisp.textContent = fmtTime(exitDate);
      workedEl.textContent = fmtHMS(worked);
      remainingEl.textContent = fmtHMS(remaining);
      pctEl.textContent = `${pct}%`;
      fillEl.style.width = `${pct}%`;

      const done = worked >= WORKDAY_MS;
      completeEl.classList.toggle('show', done);
      statusEl.textContent = done ? 'SHIFT COMPLETE (SAVED)' : 'RUNNING (SAVED)';
    }

    function startWith(hhmm){
      entryDate = parseTimeToDate(hhmm);
      localStorage.setItem(keyForToday(), hhmm);
      stopTick();
      updateUI();
      tickTimer = setInterval(updateUI, 1000);
    }

    function resetAll(){
      stopTick();
      localStorage.removeItem(keyForToday());
      entryDate = null;
      completeEl.classList.remove('show');
      updateUI();
    }

    startBtn.addEventListener('click', () => {
      const v = entryInput.value;
      if (!v) return;
      startWith(v);
    });

    resetBtn.addEventListener('click', resetAll);

    entryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startBtn.click();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') resetAll();
    });

    // Init
    setHeaderDate();
    const saved = localStorage.getItem(keyForToday());
    if (saved){
      entryInput.value = saved;
      startWith(saved);
    } else {
      // default suggestion: now (rounded to minute)
      const n = new Date();
      entryInput.value = `${pad2(n.getHours())}:${pad2(n.getMinutes())}`;
      updateUI();
    }
  </script>
</body>
</html>
